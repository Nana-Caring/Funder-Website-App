<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Service Diagnostic Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #185c37;
            text-align: center;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #185c37;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin: 24px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .primary {
            background: #185c37;
            color: white;
        }
        .primary:hover {
            background: #0f3d26;
        }
        .secondary {
            background: #f0f0f0;
            color: #333;
        }
        .secondary:hover {
            background: #e0e0e0;
        }
        .danger {
            background: #f44336;
            color: white;
        }
        .danger:hover {
            background: #d32f2f;
        }
        .results {
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #185c37;
        }
        .error {
            border-left-color: #f44336;
            background: #ffebee;
        }
        .success {
            border-left-color: #4caf50;
            background: #e8f5e8;
        }
        .warning {
            border-left-color: #ff9800;
            background: #fff3e0;
        }
        pre {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-healthy { background: #4caf50; }
        .status-degraded { background: #ff9800; }
        .status-down { background: #f44336; }
        .metric {
            display: inline-block;
            background: #e3f2fd;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Backend Service Diagnostic Tool</h1>
        <p style="text-align: center; color: #666; margin-bottom: 32px;">
            Test and diagnose connectivity issues with the Nana Caring backend service
        </p>

        <div class="input-group">
            <label for="baseUrl">Backend Base URL:</label>
            <input type="url" id="baseUrl" value="https://nanacaring-backend.onrender.com" placeholder="Enter backend URL">
        </div>

        <div class="input-group">
            <label for="authToken">Authentication Token (Optional):</label>
            <input type="password" id="authToken" placeholder="Enter your auth token to test authenticated endpoints">
        </div>

        <div class="button-group">
            <button class="primary" onclick="runHealthCheck()">🏥 Health Check</button>
            <button class="primary" onclick="testBasicEndpoints()">🔗 Test Basic Endpoints</button>
            <button class="primary" onclick="testCaregiverEndpoints()">👩‍⚕️ Test Caregiver Endpoints</button>
            <button class="secondary" onclick="runFullDiagnostics()">📊 Full Diagnostics</button>
            <button class="danger" onclick="clearResults()">🗑️ Clear Results</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const resultsDiv = document.getElementById('results');
        let diagnosticResults = [];

        function logResult(title, result, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            diagnosticResults.push({
                timestamp,
                title,
                result,
                type
            });
            updateResultsDisplay();
        }

        function updateResultsDisplay() {
            if (diagnosticResults.length === 0) {
                resultsDiv.innerHTML = '';
                return;
            }

            const html = diagnosticResults.map(item => `
                <div class="results ${item.type}">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <strong>${item.title}</strong>
                        <span style="font-size: 12px; color: #666;">${item.timestamp}</span>
                    </div>
                    <pre>${typeof item.result === 'string' ? item.result : JSON.stringify(item.result, null, 2)}</pre>
                </div>
            `).join('');

            resultsDiv.innerHTML = html;
        }

        function clearResults() {
            diagnosticResults = [];
            updateResultsDisplay();
        }

        function getBaseUrl() {
            return document.getElementById('baseUrl').value.trim() || 'https://nanacaring-backend.onrender.com';
        }

        function getAuthToken() {
            return document.getElementById('authToken').value.trim();
        }

        async function makeRequest(url, options = {}) {
            const startTime = Date.now();
            const fullUrl = url.startsWith('http') ? url : `${getBaseUrl()}${url}`;
            
            try {
                const response = await fetch(fullUrl, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });

                const responseTime = Date.now() - startTime;
                const statusText = `${response.status} ${response.statusText}`;
                
                let responseData = null;
                try {
                    responseData = await response.text();
                    // Try to parse as JSON if possible
                    try {
                        responseData = JSON.parse(responseData);
                    } catch (e) {
                        // Keep as text if not valid JSON
                    }
                } catch (e) {
                    responseData = 'Failed to read response body';
                }

                return {
                    ok: response.ok,
                    status: response.status,
                    statusText,
                    responseTime,
                    data: responseData,
                    headers: Object.fromEntries(response.headers.entries())
                };
            } catch (error) {
                const responseTime = Date.now() - startTime;
                return {
                    ok: false,
                    status: 0,
                    statusText: 'Network Error',
                    responseTime,
                    error: error.message,
                    data: null
                };
            }
        }

        async function runHealthCheck() {
            logResult('🏥 Health Check', 'Starting health check...', 'info');
            
            const result = await makeRequest('/api/health');
            
            let resultType = 'error';
            let resultText = '';
            
            if (result.ok) {
                resultType = 'success';
                resultText = `✅ Service is healthy (${result.responseTime}ms)\\n${JSON.stringify(result.data, null, 2)}`;
            } else if (result.status === 0) {
                resultText = `❌ Cannot reach server\\nError: ${result.error}\\nResponse Time: ${result.responseTime}ms`;
            } else {
                resultText = `⚠️ Service responded but not healthy\\nStatus: ${result.statusText}\\nResponse Time: ${result.responseTime}ms\\nResponse: ${JSON.stringify(result.data, null, 2)}`;
            }
            
            logResult('Health Check Results', resultText, resultType);
        }

        async function testBasicEndpoints() {
            logResult('🔗 Basic Endpoints Test', 'Testing basic endpoints...', 'info');
            
            const endpoints = [
                '/api/health',
                '/api/auth/login',  // This should return method not allowed for GET
                '/api/users',       // Might need auth
                '/'                 // Root endpoint
            ];

            const results = [];
            
            for (const endpoint of endpoints) {
                const result = await makeRequest(endpoint);
                results.push({
                    endpoint,
                    status: result.statusText,
                    responseTime: `${result.responseTime}ms`,
                    ok: result.ok
                });
            }

            const summary = `Tested ${endpoints.length} endpoints:\\n` +
                results.map(r => `${r.endpoint}: ${r.status} (${r.responseTime})`).join('\\n');

            logResult('Basic Endpoints Results', summary, 'info');
        }

        async function testCaregiverEndpoints() {
            const token = getAuthToken();
            if (!token) {
                logResult('❌ Authentication Required', 'Please enter an authentication token to test caregiver endpoints', 'error');
                return;
            }

            logResult('👩‍⚕️ Caregiver Endpoints Test', 'Testing caregiver endpoints...', 'info');
            
            const endpoints = [
                '/api/caregiver/dependents',
                '/api/caregiver/stats',
                '/api/caregiver/activity',
                '/api/caregiver/transactions'
            ];

            const results = [];
            
            for (const endpoint of endpoints) {
                const result = await makeRequest(endpoint, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                results.push({
                    endpoint,
                    status: result.statusText,
                    responseTime: `${result.responseTime}ms`,
                    ok: result.ok,
                    data: result.ok ? 'Success' : (result.error || JSON.stringify(result.data).substring(0, 100))
                });
            }

            const summary = `Tested ${endpoints.length} caregiver endpoints:\\n` +
                results.map(r => `${r.endpoint}: ${r.status} (${r.responseTime}) - ${r.data}`).join('\\n');

            const hasErrors = results.some(r => !r.ok);
            logResult('Caregiver Endpoints Results', summary, hasErrors ? 'error' : 'success');
        }

        async function runFullDiagnostics() {
            logResult('📊 Full Diagnostics', 'Running comprehensive diagnostics...', 'info');
            
            // Clear previous results for this run
            diagnosticResults = diagnosticResults.filter(r => !r.title.includes('Full Diagnostics'));
            
            const diagnostics = {
                timestamp: new Date().toISOString(),
                baseUrl: getBaseUrl(),
                hasToken: !!getAuthToken(),
                tests: {}
            };

            // Test 1: Basic connectivity
            const connectivityResult = await makeRequest('/');
            diagnostics.tests.connectivity = {
                status: connectivityResult.ok ? 'PASS' : 'FAIL',
                responseTime: connectivityResult.responseTime,
                details: connectivityResult.statusText
            };

            // Test 2: Health endpoint
            const healthResult = await makeRequest('/api/health');
            diagnostics.tests.health = {
                status: healthResult.ok ? 'PASS' : 'FAIL',
                responseTime: healthResult.responseTime,
                details: healthResult.statusText
            };

            // Test 3: CORS preflight
            try {
                const corsResult = await makeRequest('/api/health', {
                    method: 'OPTIONS'
                });
                diagnostics.tests.cors = {
                    status: corsResult.status < 400 ? 'PASS' : 'FAIL',
                    responseTime: corsResult.responseTime,
                    details: corsResult.statusText
                };
            } catch (e) {
                diagnostics.tests.cors = {
                    status: 'FAIL',
                    details: e.message
                };
            }

            // Test 4: Authentication endpoint
            const authResult = await makeRequest('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({})  // Empty body to test if endpoint exists
            });
            diagnostics.tests.authentication = {
                status: authResult.status === 400 ? 'PASS' : 'FAIL', // 400 is expected for empty body
                responseTime: authResult.responseTime,
                details: authResult.statusText
            };

            // Generate summary
            const passedTests = Object.values(diagnostics.tests).filter(t => t.status === 'PASS').length;
            const totalTests = Object.keys(diagnostics.tests).length;
            
            diagnostics.summary = {
                overallHealth: passedTests === totalTests ? 'HEALTHY' : 'DEGRADED',
                testsPassedPercent: Math.round((passedTests / totalTests) * 100),
                avgResponseTime: Math.round(
                    Object.values(diagnostics.tests)
                        .filter(t => t.responseTime)
                        .reduce((sum, t) => sum + t.responseTime, 0) / totalTests
                )
            };

            const resultText = `📋 DIAGNOSTIC SUMMARY\\n` +
                `Overall Health: ${diagnostics.summary.overallHealth}\\n` +
                `Tests Passed: ${passedTests}/${totalTests} (${diagnostics.summary.testsPassedPercent}%)\\n` +
                `Average Response Time: ${diagnostics.summary.avgResponseTime}ms\\n\\n` +
                `DETAILED RESULTS:\\n` +
                Object.entries(diagnostics.tests).map(([test, result]) => 
                    `${test.toUpperCase()}: ${result.status} (${result.responseTime || 'N/A'}ms) - ${result.details}`
                ).join('\\n');

            const resultType = diagnostics.summary.overallHealth === 'HEALTHY' ? 'success' : 'warning';
            logResult('📊 Full Diagnostics Results', resultText, resultType);
        }

        // Initialize with current time
        document.addEventListener('DOMContentLoaded', function() {
            logResult('🔧 Diagnostic Tool Ready', `Backend Service Diagnostic Tool initialized\\nTarget: ${getBaseUrl()}\\nTime: ${new Date().toLocaleString()}`, 'info');
        });
    </script>
</body>
</html>
